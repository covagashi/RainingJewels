name: rainingjewels_new
description: "Basic relaxing sounds for meditation and sleep."
publish_to: 'none'
version: 1.1.0+7

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  wakelock_plus: ^1.3.2
  screen_brightness: ^2.1.1
  url_launcher: ^6.3.2
  audio_service: ^0.18.18
  just_audio: ^0.10.4
  permission_handler: ^12.0.1
  in_app_review: ^2.0.10
  shared_preferences: ^2.5.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/background.png
    - assets/icon_background.png
    - assets/icon_foreground.png
    - assets/icon.png
    - assets/picto.png
    - assets/rain.mp3
    - assets/thunder.mp3
    - assets/wind.mp3
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21
