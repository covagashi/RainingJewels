name: rainingjewels_new
description: "Basic relaxing sounds for meditation and sleep."
publish_to: 'none'
version: 1.0.5+6

environment:
  sdk: '>=3.3.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Dependencias de la app
  flutter_launcher_icons: ^0.13.1
  wakelock_plus: ^1.2.8
  screen_brightness: ^1.0.1
  url_launcher: ^6.2.5
  audio_service: ^0.18.15
  just_audio: ^0.9.40
  audio_session: ^0.1.25
  permission_handler: ^11.3.1
  in_app_review: ^2.0.9
  shared_preferences: ^2.3.3


  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # Tus assets
  assets:
    - assets/background.png
    - assets/icon_background.png
    - assets/icon_foreground.png
    - assets/icon.png
    - assets/picto.png
    - assets/rain.mp3
    - assets/thunder.mp3
    - assets/wind.mp3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon.png"
  min_sdk_android: 21