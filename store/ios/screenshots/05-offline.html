<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Offline — Raining Jewels</title>
    <link rel="stylesheet" href="shared.css" />
    <style>
      .feature-card {
        position: absolute;
        left: 64px;
        right: 64px;
        top: 50%;
        transform: translateY(-42%);
        z-index: 20;
        background: rgba(20, 23, 30, 0.92);
        border: 1.5px solid rgba(255, 255, 255, 0.22);
        border-radius: 48px;
        padding: 72px 56px;
        backdrop-filter: blur(20px);
      }
      .feature-card h1 {
        font-family: 'Manrope', sans-serif;
        font-weight: 600;
        font-size: 56px;
        line-height: 1.2;
        letter-spacing: -0.4px;
        margin-bottom: 28px;
      }
      .feature-card ul {
        list-style: none;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      .feature-card li {
        display: flex;
        gap: 24px;
        align-items: flex-start;
        font-size: 32px;
        color: var(--text-secondary);
        line-height: 1.35;
      }
      .feature-card .dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        margin-top: 12px;
        flex-shrink: 0;
      }
      .feature-card .strong {
        color: var(--text-primary);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="phone playing">
      <div class="status-bar">
        <span>9:41</span>
        <span class="right">●●●●  100%</span>
      </div>
      <div class="rain playing" aria-hidden="true" id="rain"></div>
      <div class="player playing" style="opacity: 0.35">
        <div class="stage">
          <div class="dial">
            <div class="dial-row far"><span class="name">Brown Noise</span></div>
            <div class="dial-row"><span class="name">Pink Noise</span></div>
            <div class="dial-row head playing"><span class="name">Rain</span></div>
            <div class="dial-row"><span class="name">Thunder</span></div>
            <div class="dial-row far"><span class="name">Wind</span></div>
            <div class="head-ticks"><span></span><span></span></div>
          </div>
          <div class="transport">
            <svg viewBox="0 0 24 24" stroke="#9CC2D4" stroke-width="1.75" fill="none" stroke-linecap="round">
              <line x1="9" y1="7" x2="9" y2="17" />
              <line x1="15" y1="7" x2="15" y2="17" />
            </svg>
          </div>
          <div class="status-line">Playing</div>
        </div>
      </div>
      <div class="feature-card">
        <h1>Free. Offline. No account.</h1>
        <ul>
          <li><span class="dot"></span><span><span class="strong">31 ambient sounds</span> bundled in the app — works on a plane</span></li>
          <li><span class="dot"></span><span><span class="strong">No ads, no paywall, no tracking</span></span></li>
          <li><span class="dot"></span><span><span class="strong">Background playback</span> with lock-screen controls</span></li>
          <li><span class="dot"></span><span><span class="strong">GPL-3.0 free software</span> — open source</span></li>
        </ul>
      </div>
      <div class="home-indicator"></div>
    </div>
    <script>
      const rain = document.getElementById('rain');
      for (let i = 0; i < 48; i++) {
        const d = document.createElement('div');
        d.className = 'drop';
        d.style.left = Math.random() * 100 + '%';
        d.style.top = Math.random() * 100 + '%';
        d.style.height = 24 + Math.random() * 56 + 'px';
        d.style.opacity = 0.12 + Math.random() * 0.35;
        rain.appendChild(d);
      }
    </script>
  </body>
</html>
