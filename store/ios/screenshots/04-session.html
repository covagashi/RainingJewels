<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Session controls — Raining Jewels</title>
    <link rel="stylesheet" href="shared.css" />
  </head>
  <body>
    <div class="phone playing">
      <div class="status-bar">
        <span>9:41</span>
        <span class="right">●●●●  100%</span>
      </div>
      <div class="rain playing" aria-hidden="true" id="rain"></div>
      <div class="player playing">
        <div class="stage" style="padding-bottom: 420px">
          <div class="dial" style="height: 720px">
            <div class="dial-row far"><span class="name">Crickets</span></div>
            <div class="dial-row"><span class="name">Night</span></div>
            <div class="dial-row head playing">
              <span class="name">Campfire</span>
            </div>
            <div class="dial-row"><span class="name">Purring Cat</span></div>
            <div class="dial-row far"><span class="name">Heartbeat</span></div>
            <div class="head-ticks"><span></span><span></span></div>
          </div>
          <div class="transport">
            <svg viewBox="0 0 24 24" stroke="#9CC2D4" stroke-width="1.75" fill="none" stroke-linecap="round">
              <line x1="9" y1="7" x2="9" y2="17" />
              <line x1="15" y1="7" x2="15" y2="17" />
            </svg>
          </div>
          <div class="status-line">Playing</div>
        </div>

        <div class="panel">
          <div class="label-row">
            <svg viewBox="0 0 24 24"><path d="M12 6v6l4 2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9"/></svg>
            <span>Stop after</span>
          </div>
          <div class="chips">
            <div class="chip">Off</div>
            <div class="chip">15m</div>
            <div class="chip selected">30m</div>
            <div class="chip">60m</div>
          </div>
          <div class="volume-row">
            <svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4V5z" stroke-linejoin="round"/><path d="M15.5 8.5a5 5 0 010 7" stroke-linecap="round"/></svg>
            <div class="slider-track">
              <div class="slider-fill"></div>
              <div class="slider-thumb"></div>
            </div>
            <svg viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4V5z" stroke-linejoin="round"/><path d="M15.5 8.5a5 5 0 010 7M18 6a9 9 0 010 12" stroke-linecap="round"/></svg>
          </div>
        </div>

        <div class="dock">
          <div class="dock-bar">
            <svg viewBox="0 0 24 24"><path d="M12 6v6l4 2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="12" r="9"/></svg>
            <span>Session</span>
            <svg viewBox="0 0 24 24"><path d="M18 9l-6 6-6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
        </div>
      </div>
      <div class="home-indicator"></div>
    </div>
    <script>
      const rain = document.getElementById('rain');
      for (let i = 0; i < 40; i++) {
        const d = document.createElement('div');
        d.className = 'drop';
        d.style.left = Math.random() * 100 + '%';
        d.style.top = Math.random() * 55 + '%';
        d.style.height = 22 + Math.random() * 50 + 'px';
        d.style.opacity = 0.15 + Math.random() * 0.4;
        rain.appendChild(d);
      }
    </script>
  </body>
</html>
